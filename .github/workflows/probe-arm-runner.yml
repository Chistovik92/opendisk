name: "Разведка: раннеры"

# Одноразовая проверка доступности раннеров перед тем, как завязывать на них
# выпуск релиза.
#
# Вопрос дешёвый, а цена ошибки высокая: недоступный раннер не падает, а
# бесконечно висит в очереди — и вместе с ним висит весь релиз, потому что
# публикация ждёт все платформы сразу. Ровно так и случилось с macos-13:
# сборки под Intel-Mac простояли в очереди больше часа, ни разу не начавшись.
#
# После того как ответы получены, workflow можно удалить.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, macos-15-intel, macos-13, macos-latest]
    runs-on: ${{ matrix.runner }}
    # Коротко: если за это время раннер не нашёлся, значит его и нет.
    timeout-minutes: 6
    steps:
      - name: Что это за машина
        run: |
          uname -a || true
          echo "runner: ${{ matrix.runner }}"
          echo "arch: $(uname -m 2>/dev/null || echo windows)"
        shell: bash
