name: Release

# Сборка установщиков под все платформы.
#
# jpackage умеет собирать пакет только под ту ОС, на которой запущен, поэтому
# Windows-установщик и Linux-пакеты собираются на разных раннерах. Раньше MSI
# собирался на машине разработчика — это невоспроизводимо и не даёт Linux вообще.
on:
  push:
    tags:
      - 'v*'
  # Позволяет собрать пакеты, не выпуская релиз, — чтобы проверить сборку.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      # Одна упавшая платформа не должна отменять сборку остальных:
      # лучше выпустить то, что собралось, чем ничего.
      fail-fast: false
      matrix:
        include:
          # Windows: .exe, а не .msi.
          #
          # Это обёртка Burn поверх нашего же MSI — вся логика установщика
          # (закрытие работающего приложения, стабильные GUID-ы, уборка при
          # удалении) осталась в нём, наружу уезжает exe. См. wix/Bundle.wxs.
          - os: windows-latest
            name: Windows-x64
            jdk: temurin
            jdkArch: x64
            tasks: packageWixExe
            artifacts: composeApp/build/distributions/*.exe
          # ARM-раннер Windows проверен отдельно перед тем, как заводить сюда:
          # он существует, и JDK 17 под aarch64 на нём ставится — но только
          # не Temurin, у него сборок под Windows/AArch64 нет.
          - os: windows-11-arm
            name: Windows-arm64
            jdk: liberica
            jdkArch: aarch64
            tasks: packageWixExe
            artifacts: composeApp/build/distributions/*.exe
          # 22.04, а не latest: на 24.04 jpackage прописывает зависимости
          # с суффиксом t64 (libasound2t64, libpng16-16t64) — таких пакетов нет
          # ни в Debian 12, ни в Ubuntu 22.04, и установка там просто
          # не проходит. Пакеты 24.04 объявляют Provides на старые имена,
          # поэтому сборка на 22.04 ставится и туда, и сюда.
          - os: ubuntu-22.04
            name: Linux
            jdk: temurin
            jdkArch: x64
            tasks: packageDeb packageRpm createDistributable
            artifacts: |
              composeApp/build/compose/binaries/main/deb/*.deb
              composeApp/build/compose/binaries/main/rpm/*.rpm
              composeApp/build/distributions/*.AppImage
              composeApp/build/distributions/*.rpm
          # macOS собирается, но никем не проверялась: Mac для проверки нет.
          # Пакет всё равно полезнее, чем его отсутствие.
          #
          # Две архитектуры, потому что Mac бывают и те, и другие: macos-13 —
          # последний раннер на Intel, macos-latest — Apple Silicon.
          - os: macos-13
            name: macOS-x64
            arch: x64
            jdk: temurin
            jdkArch: x64
            tasks: packageDmg
            artifacts: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: macos-latest
            name: macOS-arm64
            arch: arm64
            jdk: temurin
            jdkArch: aarch64
            tasks: packageDmg
            artifacts: composeApp/build/compose/binaries/main/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          # Архитектура задаётся явно для каждой платформы, а не угадывается:
          # на Apple Silicon и на ARM-раннере Windows умолчание привело бы
          # к x64-сборке JDK под эмуляцией, а собранное ею приложение было бы
          # x64 при ARM-овом имени файла.
          distribution: ${{ matrix.jdk }}
          java-version: '17'
          architecture: ${{ matrix.jdkArch }}

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.os }}-

      # jpackage собирает deb через fakeroot, а rpm — через rpmbuild;
      # на чистом раннере их нет.
      - name: Инструменты упаковки для Linux
        if: startsWith(matrix.os, 'ubuntu')
        # fuse3 — не для упаковки, а для тестов: /dev/fuse на раннере есть,
        # и приложение считает монтирование доступным, но без fusermount3
        # rclone смонтировать ничего не может. Это та же зависимость, которую
        # рекомендует наш deb-пакет.
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm fuse3

      # Интеграционные тесты гоняются против настоящего rclone и по умолчанию
      # пропускаются — без пути к бинарнику. В CI пропускать их нельзя: моки
      # отвечают так, как их научили, и расхождение между тем, что умеет клиент,
      # и тем, что реально отвечает rclone, они по определению не ловят. Поэтому
      # сначала кладём бинарник в ресурсы, потом запускаем тесты с указанием
      # на него.
      - name: Тесты
        shell: bash
        run: |
          ./gradlew :composeApp:prepareAppResources --no-daemon
          # Не через `ls` двух путей сразу: если одного из них нет, ls выходит
          # с кодом 2, а GitHub запускает bash с -eo pipefail — и шаг падает,
          # хотя бинарник на месте.
          rclone=""
          for candidate in composeApp/build/appResources/common/rclone \
                           composeApp/build/appResources/common/rclone.exe; do
            if [ -f "$candidate" ]; then
              rclone="$candidate"
              break
            fi
          done
          if [ -z "$rclone" ]; then
            echo "встроенный rclone не найден — интеграционные тесты нельзя пропускать молча" >&2
            exit 1
          fi
          ./gradlew test --no-daemon -Dopendisk.rclone.path="$PWD/$rclone"

      - name: Сборка пакетов
        run: ./gradlew ${{ matrix.tasks }} --no-daemon

      # Две вещи, которые jpackage делает не так, а повлиять на них из сборки
      # нельзя. Обе чинятся распаковкой и пересборкой готового пакета.
      #
      # 1. Встроенный rclone приезжает с правами 644, то есть неисполняемым:
      #    приложение не смогло бы его запустить, а исправить права на месте
      #    не может — /opt принадлежит root.
      # 2. postinst безусловно вызывает xdg-desktop-menu, а тот падает на
      #    системах без /etc/xdg/menus (минимальные установки, серверы, WSL).
      #    postinst идёт с set -e, поэтому пакет оставался ненастроенным
      #    и ломал dpkg. Ярлык в меню приложений того не стоит.
      - name: Починить содержимое deb
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          deb=$(ls composeApp/build/compose/binaries/main/deb/*.deb)
          work=$(mktemp -d)
          dpkg-deb -R "$deb" "$work"

          chmod 755 "$work/opt/opendisk/lib/app/resources/rclone"

          # FUSE — то, без чего облако не подключить как диск. jpackage
          # зависимости не даёт задать, поэтому дописываем сюда.
          #
          # Recommends, а не Depends: apt ставит рекомендации по умолчанию,
          # то есть пользователь получит fuse3 сам собой, но на системах,
          # где пакета нет или он не нужен, установка не заблокируется —
          # приложение без FUSE запускается и облака добавлять позволяет.
          if grep -q '^Recommends:' "$work/DEBIAN/control"; then
            sed -i 's|^Recommends:.*|&, fuse3|' "$work/DEBIAN/control"
          else
            sed -i '/^Depends:/a Recommends: fuse3' "$work/DEBIAN/control"
          fi

          for script in postinst prerm; do
            [ -f "$work/DEBIAN/$script" ] || continue
            # Разделитель # вместо | — в самой замене есть ||.
            sed -i '/^xdg-desktop-menu /s#$# || true#' "$work/DEBIAN/$script"
          done

          # При обновлении останавливаем работающую копию. Без этого она
          # продолжает работать со старым кодом: в Linux файлы заменяются
          # и под запущенным процессом, поэтому с точки зрения пользователя
          # обновление просто не происходит.
          #
          # Именно preinst новой версии: dpkg вызывает его до распаковки,
          # то есть исправление действует уже при обновлении на эту версию,
          # а не начиная со следующей.
          cat > "$work/DEBIAN/preinst" <<'PREINST'
          #!/bin/sh
          set -e
          if [ "$1" = upgrade ]; then
              # Сначала по-хорошему: по TERM приложение успевает отключить
              # диски и погасить свой rclone.
              pkill -TERM -f "^/opt/opendisk/bin/OpenDisk" 2>/dev/null || true
              i=0
              while [ $i -lt 15 ] && pgrep -f "^/opt/opendisk/bin/OpenDisk" >/dev/null 2>&1; do
                  sleep 1
                  i=$((i + 1))
              done
              pkill -KILL -f "^/opt/opendisk/bin/OpenDisk" 2>/dev/null || true
              # Дочерний rclone мог пережить родителя и держать диски.
              pkill -TERM -f "^/opt/opendisk/lib/app/resources/rclone" 2>/dev/null || true
          fi
          exit 0
          PREINST
          sed -i 's/^          //' "$work/DEBIAN/preinst"
          chmod 755 "$work/DEBIAN/preinst"

          dpkg-deb -b "$work" "$deb"
          rm -rf "$work"

          echo "Права и maintainer-скрипты после починки:"
          dpkg-deb -c "$deb" | grep '/opt/opendisk/lib/app/resources/rclone$'
          dpkg-deb -I "$deb" postinst | grep xdg-desktop-menu
          dpkg-deb -I "$deb" control | grep -E '^(Depends|Recommends):'

          # Пакет обязан быть исполняемым — иначе смысла в починке нет.
          dpkg-deb -c "$deb" | grep '/opt/opendisk/lib/app/resources/rclone$' | grep -q '^-rwx' ||
            { echo 'rclone так и не стал исполняемым' >&2; exit 1; }
          dpkg-deb -I "$deb" preinst | grep -q 'pkill -TERM' ||
            { echo 'deb не останавливает приложение при обновлении' >&2; exit 1; }

      # Тот же набор проблем есть и у rpm, причём про права на rclone мы там
      # не знали вовсе: пакет всё это время ставил его неисполняемым.
      # Починка вынесена скриптом, чтобы её можно было прогнать вручную.
      - name: Починить содержимое rpm
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          rpm=$(ls composeApp/build/compose/binaries/main/rpm/*.rpm)
          sh scripts/repack-rpm.sh "$rpm"

      # AppImage jpackage не умеет, а формат для Linux привычный: один файл,
      # запускается без установки и без прав администратора.
      - name: Собрать AppImage
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          image=composeApp/build/compose/binaries/main/app/OpenDisk
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          appdir=build/OpenDisk.AppDir
          rm -rf "$appdir" && mkdir -p "$appdir/usr"
          cp -r "$image"/. "$appdir/usr/"

          # Та же беда, что и с deb: jpackage кладёт встроенный rclone
          # с правами 644, и приложение не может его запустить. В AppImage
          # это критичнее — там файловая система только для чтения, и
          # исправить права на месте нельзя вообще никак.
          chmod 755 "$appdir/usr/lib/app/resources/rclone"

          cp composeApp/icons/opendisk.png "$appdir/opendisk.png"
          cat > "$appdir/opendisk.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=OpenDisk
          Comment=Open client for cloud drives
          Exec=OpenDisk
          Icon=opendisk
          Categories=Utility;
          Terminal=false
          DESKTOP

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          exec "$(dirname "$(readlink -f "$0")")/usr/bin/OpenDisk" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o build/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
          # На раннере нет FUSE, поэтому инструмент распаковываем и запускаем
          # напрямую — сам себя он смонтировать не сможет.
          (cd build && ./appimagetool --appimage-extract > /dev/null)
          mkdir -p composeApp/build/distributions
          ARCH=x86_64 build/squashfs-root/AppRun "$appdir" \
            "composeApp/build/distributions/OpenDisk-$version-x86_64.AppImage"
          ls -la composeApp/build/distributions/*.AppImage

          # Проверяем результат, а не намерение: в первой сборке AppImage
          # rclone уехал неисполняемым, и приложение запускалось без него.
          appimage=$(ls composeApp/build/distributions/*.AppImage)
          chmod +x "$appimage"
          (cd build && rm -rf check && mkdir check && cd check &&
            "../../$appimage" --appimage-extract > /dev/null)
          perms=$(stat -c '%A' build/check/squashfs-root/usr/lib/app/resources/rclone)
          echo "права на rclone внутри AppImage: $perms"
          case "$perms" in
            -rwx*) echo "исполняемый — порядок" ;;
            *) echo "ОШИБКА: rclone в AppImage не исполняемый" >&2; exit 1 ;;
          esac

      # Отдельный пакет для ALT Linux и Simply Linux.
      #
      # ALT — не производная Fedora и не совместим с ней по именам пакетов и
      # зависимостей, поэтому rpm от jpackage там либо не ставится, либо тянет
      # не то. Собираем в контейнере самого ALT: только у него правильные
      # rpmbuild и генератор зависимостей. Java внутри не нужна — образ
      # приложения со своей JRE уже собран этой сборкой.
      - name: Пакет для ALT Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          sh scripts/build-alt-rpm.sh "$version"

      # У обеих сборок macOS jpackage выдаёт файл с одним и тем же именем,
      # и в релизе они затёрли бы друг друга. Разводим по архитектурам —
      # человеку с Intel-маком нужен свой файл, а не «повезёт-не-повезёт».
      - name: Развести .dmg по архитектурам
        if: startsWith(matrix.os, 'macos')
        run: |
          dmg=$(ls composeApp/build/compose/binaries/main/dmg/*.dmg)
          base=$(basename "$dmg" .dmg)
          case "$base" in
            *-x64|*-arm64) echo "уже с архитектурой: $base"; exit 0 ;;
          esac
          mv "$dmg" "composeApp/build/compose/binaries/main/dmg/${base}-${{ matrix.arch }}.dmg"
          ls -la composeApp/build/compose/binaries/main/dmg/

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: opendisk-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      # Файлы попадают в релиз по тегу; сам релиз создаётся, если его ещё нет.
      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Три сборки идут одновременно и все три доходят сюда. Проверки
          # «есть ли релиз» мало: между проверкой и созданием его успевает
          # создать соседняя сборка, и `gh release create` отвечает
          # «Release.tag_name already exists» — так на 0.3.0 потерялся dmg,
          # потому что сборка macOS упала до выкладывания.
          #
          # Поэтому чужое создание считаем удачей: релиз есть, а кто его
          # создал — неважно.
          #
          # Создаём черновиком. Публикует релиз отдельная работа `publish`,
          # и только убедившись, что установщики собраны под все платформы:
          # на 0.4.0 тесты упали на Linux и macOS, а Windows дошёл до конца и
          # опубликовал релиз с одним лишь MSI. Скрипт установки на Linux берёт
          # последний релиз — и для него это выглядело как «пакета нет».
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "OpenDisk $tag" --prerelease --draft \
              --notes "Сборка $tag" ||
              gh release view "$tag" >/dev/null 2>&1 ||
              { echo "релиз $tag не создан и не найден" >&2; exit 1; }
          fi
          # Каталоги перечислены поимённо и с maxdepth, а не одним деревом:
          # внутри образа приложения лежит встроенный winfsp.msi, и поиск по
          # всему дереву утащил бы его в релиз отдельным файлом — так и вышло
          # в первой сборке 0.1.11. Каталоги разные на разных платформах,
          # поэтому код возврата find гасим.
          files=$(find composeApp/build/distributions \
            composeApp/build/compose/binaries/main/deb \
            composeApp/build/compose/binaries/main/rpm \
            composeApp/build/compose/binaries/main/dmg \
            -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.dmg' -o -name '*.AppImage' \) \
            2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Нечего выкладывать — пакеты не найдены" >&2
            exit 1
          fi
          echo "Выкладываю:"; echo "$files"

          # Контрольные суммы нужны скрипту установки: он скачивает пакет
          # и сразу его ставит, поэтому обязан убедиться, что скачал именно то.
          sums="SHA256SUMS-${{ matrix.name }}"
          : > "$sums"
          for file in $files; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")") >> "$sums"
          done
          cat "$sums"

          gh release upload "$tag" $files "$sums" --clobber

  # Публикация — отдельно от сборки и после всех трёх платформ сразу.
  #
  # Пока это делала каждая сборка сама, релиз становился видимым от первой
  # дошедшей до конца. На 0.4.0 так и вышло: Linux и macOS упали на тестах,
  # Windows дошёл — и наружу уехал релиз, в котором из установщиков был только
  # MSI. `needs` здесь и есть требование «все платформы или ничего»: если хоть
  # одна сборка упала, эта работа не запустится, релиз останется черновиком и
  # пользователи его просто не увидят.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверить, что собрались все платформы, и опубликовать
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=$(gh release view "$tag" --json assets -q '.assets[].name')
          echo "В релизе $tag сейчас:"; echo "$assets" | sed 's/^/  /'

          # Проверяем по хвосту имени, а не по полному: версия в имени своя
          # у каждой платформы (у .dmg мажорная единица, потому что macOS
          # не принимает ноль), и полные имена пришлось бы править каждый выпуск.
          #
          # Архитектуры перечислены отдельно намеренно. Проверки «есть хоть
          # один .exe» не хватает: если упадёт только ARM-сборка, релиз
          # с одним x64 прошёл бы как полный — а человек с ARM-ноутбуком
          # остался бы ни с чем.
          #
          # Оба rpm тоже разведены: alt1 — сборка для ALT и Simply Linux,
          # у которых свои имена зависимостей, а -1 — для Fedora и прочих.
          # Один вместо другого поставить нельзя.
          missing=""
          for kind in \
              -x64.exe -arm64.exe \
              _amd64.deb -1.x86_64.rpm alt1.x86_64.rpm -x86_64.AppImage \
              -x64.dmg -arm64.dmg \
              SHA256SUMS-Windows-x64 SHA256SUMS-Windows-arm64 \
              SHA256SUMS-Linux \
              SHA256SUMS-macOS-x64 SHA256SUMS-macOS-arm64; do
            echo "$assets" | grep -q -- "$kind" || missing="$missing $kind"
          done

          if [ -n "$missing" ]; then
            echo "В релизе не хватает:$missing" >&2
            echo "Релиз оставлен черновиком — неполный выпуск наружу не уходит." >&2
            exit 1
          fi

          # Только теперь релиз становится видимым.
          gh release edit "$tag" --draft=false
          echo "Релиз $tag опубликован: установщики есть под все платформы."
