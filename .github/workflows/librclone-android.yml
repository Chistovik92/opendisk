name: librclone для Android

# Собирает rclone в виде Android-библиотеки (.aar) через gomobile.
#
# Зачем отдельно от основной сборки: на Android нельзя запустить `rclone rcd`
# отдельным процессом и ходить в него по HTTP, как на десктопе — система не даёт
# приложению исполнять свои файлы. Официальный путь — librclone: та же RC API,
# но вызывается внутри процесса функцией RcloneRPC(метод, json) -> json.
# Поэтому слой разбора ответов в rclone-bridge остаётся общим, меняется только
# транспорт.
#
# Здесь же и проверяется, что связка вообще собирается: gomobile у rclone
# помечен экспериментальным, и ломается он тихо.

on:
  # Только вручную. Раньше сборка запускалась от любой правки
  # composeApp/build.gradle.kts — в том числе от смены номера версии
  # приложения, к rclone отношения не имеющей. Каждый такой запуск
  # перезаписывал опубликованную библиотеку, а gomobile побайтово
  # одинакового результата не даёт: закреплённая контрольная сумма
  # устаревала, и сборка Android-модуля падала на ровном месте.
  workflow_dispatch:
    inputs:
      overwrite:
        description: >-
          Перезаписать уже опубликованную библиотеку той же версии.
          Понадобится, если поменялись флаги сборки; после этого нужно
          обновить librcloneSha256 в android-core/build.gradle.kts.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Взять версию rclone из сборки десктопа
        id: version
        run: |
          # Версия одна на все платформы: расхождение между библиотекой на
          # телефоне и бинарником на компьютере означало бы разные формы
          # ответов RC API при одном и том же коде разбора.
          version=$(sed -n 's/^val rcloneVersion = "\(.*\)"/\1/p' composeApp/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "не удалось прочитать rcloneVersion из composeApp/build.gradle.kts" >&2
            exit 1
          fi
          echo "версия rclone: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Забрать исходники rclone
        run: |
          git clone --depth 1 --branch "v${{ steps.version.outputs.version }}" \
            https://github.com/rclone/rclone.git rclone-src

      - uses: actions/setup-go@v5
        with:
          # Ту же версию Go, на которой собирается сам rclone — иначе рискуем
          # собирать библиотеку тулчейном, на котором проект не проверялся.
          go-version-file: rclone-src/go.mod
          cache: false

      - name: Поставить gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Собрать .aar
        working-directory: rclone-src
        run: |
          set -x
          # ANDROID_NDK_LATEST_HOME задаёт образ раннера, но в контекст `env`
          # переменные образа не попадают — только то, что выставил сам workflow.
          # Поэтому пробрасываем здесь, а не в блоке env шага, где вышла бы пустая строка.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get golang.org/x/mobile/bind
          gomobile init
          # Только arm64 и amd64: первое — все актуальные телефоны, второе —
          # эмулятор. Каждая архитектура добавляет к .aar полную копию rclone,
          # а он большой; 32-битные сборки ради вымирающих устройств удваивали
          # бы размер установки.
          # Версию нужно проставить явно. В исходниках она записана как
          # "v<версия>-DEV", а настоящий номер релизные сборки rclone
          # подставляют линковщиком. Без этого библиотека представляется
          # как DEV-сборка, и сверить её с десктопным бинарником нельзя —
          # а сверять надо, на этом держится общий код разбора ответов.
          gomobile bind -v \
            -target=android/arm64,android/amd64 \
            -androidapi 24 \
            -javapkg=org.rclone \
            -ldflags "-s -X github.com/rclone/rclone/fs.Version=v${{ steps.version.outputs.version }}" \
            -o "$GITHUB_WORKSPACE/librclone.aar" \
            ./librclone/gomobile
          # Что подстановка сработала, проверяет инструментальный тест
          # LibrcloneTransportTest.rcloneAnswersWithItsVersion — он спрашивает
          # версию у библиотеки на устройстве и сверяет с зафиксированной.

      - name: Что получилось
        run: |
          ls -lh librclone.aar
          echo "--- содержимое ---"
          unzip -l librclone.aar
          echo "--- Java API ---"
          # Ради этого шага стоит смотреть логи: по сгенерированной сигнатуре
          # видно, как на самом деле выглядит вызов RcloneRPC из Kotlin.
          mkdir -p aar-inspect && cd aar-inspect
          unzip -o -q ../librclone.aar
          javap -classpath classes.jar org.rclone.gomobile.Gomobile || true

      # Библиотеку нужно откуда-то брать при сборке Android-модуля — и на машине
      # разработчика тоже, а Go и NDK ради этого ставить не хочется. Кладём её
      # в отдельный релиз и качаем по контрольной сумме, ровно как десктопный
      # бинарник rclone. Релиз помечен предварительным, чтобы не подменять собой
      # последнюю версию приложения на странице релизов.
      - name: Опубликовать библиотеку
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(sha256sum librclone.aar | cut -d' ' -f1)
          echo "SHA-256: $sha"
          tag="librclone-v$VERSION"
          notes="librclone $VERSION, собрана gomobile для android/arm64 и android/amd64.

          Это не приложение, а библиотека для сборки Android-клиента OpenDisk.

          SHA-256: \`$sha\`"

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ inputs.overwrite }}" != "true" ]; then
              echo "Библиотека $tag уже опубликована — оставляю как есть."
              echo "Перезаписать можно запуском с overwrite=true, но тогда"
              echo "нужно обновить librcloneSha256 в android-core/build.gradle.kts:"
              echo "  новая сумма была бы $sha"
              exit 0
            fi
            gh release upload "$tag" librclone.aar --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" librclone.aar \
              --title "librclone $VERSION для Android" \
              --notes "$notes" \
              --prerelease
          fi
