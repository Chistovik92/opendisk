name: Проба сборки iOS

# Временная: тем же способом, что и в release.yml, но без остальных платформ.
# Нужна, пока iOS-сборка не прошла ни разу — гонять ради неё весь выпуск
# (шесть сборок, проверки установки в восьми системах) слишком дорого.
# Удаляется, как только сборка пройдёт в самом выпуске.
on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Что за Xcode на раннере
        run: xcodebuild -version

      - name: Ядро rclone для iOS
        run: sh scripts/fetch-librclone-ios.sh

      - name: XcodeGen
        run: brew install xcodegen

      - name: Собрать без подписи
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          build=$(echo "$version" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')
          cd ios
          xcodegen generate
          xcodebuild \
            -project OpenDisk.xcodeproj \
            -scheme OpenDisk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковать .ipa
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          app=ios/build/Build/Products/Release-iphoneos/OpenDisk.app
          test -d "$app" || { echo "приложение не собралось: $app" >&2; exit 1; }
          mkdir -p build/ios/Payload
          cp -R "$app" build/ios/Payload/
          (cd build/ios && zip -qry "OpenDisk-$version.ipa" Payload && rm -rf Payload)
          ls -la build/ios/
          # Архитектура и подпись — в лог: по ним видно, что собралось именно
          # arm64-приложение и что оно действительно без подписи.
          file "$app/OpenDisk"
          codesign -dv "$app" 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: opendisk-iOS-probe
          path: build/ios/*.ipa
          if-no-files-found: error
