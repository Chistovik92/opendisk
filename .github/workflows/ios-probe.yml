name: Проба сборки iOS

# Временная: тот же путь, что в release.yml, без остальных платформ. Удаляется,
# как только сборка пройдёт в самом выпуске.
on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Ядро rclone для iOS
        run: sh scripts/fetch-librclone-ios.sh

      # Каталог сервисов — тот же, что на компьютере и Android: Kotlin на iOS
      # не работает, поэтому каталог приезжает в приложение файлом.
      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Каталог сервисов
        run: ./gradlew :rclone-bridge:exportCatalog --no-daemon

      - name: XcodeGen
        # Файл проекта Xcode машинно-порождаемый и в репозитории не лежит:
        # собирается из ios/project.yml.
        run: brew install xcodegen

      - name: Собрать без подписи
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "версия: $version"
          # Тот же расчёт, что у кода версии Android: 0.5.3 → 503.
          build=$(echo "$version" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')

          cd ios
          xcodegen generate
          xcodebuild \
            -project OpenDisk.xcodeproj \
            -scheme OpenDisk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковать .ipa
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          app=ios/build/Build/Products/Release-iphoneos/OpenDisk.app
          test -d "$app" || { echo "приложение не собралось: $app" >&2; exit 1; }

          # .ipa — это zip с приложением в папке Payload, больше ничего.
          mkdir -p build/ios/Payload
          cp -R "$app" build/ios/Payload/
          (cd build/ios && zip -qry "OpenDisk-$version.ipa" Payload && rm -rf Payload)
          ls -la build/ios/

