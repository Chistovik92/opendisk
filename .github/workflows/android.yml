name: Android

# Собирает модуль android-core и гоняет инструментальные тесты на эмуляторе.
#
# Обычными тестами тут не обойтись: librclone — нативная библиотека, на JVM без
# Android её просто нет, а мокать её бессмысленно — весь смысл проверки в том,
# чтобы поймать расхождение между тем, чего ждёт код, и тем, что реально отдаёт
# собранная gomobile библиотека.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-core/**'
      - 'rclone-bridge/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  test:
    # Эмулятор с аппаратным ускорением доступен только на этих раннерах.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Эмулятору нужен KVM, иначе тесты идут на программной эмуляции
      # и не укладываются в разумное время.
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Собрать модуль
        run: ./gradlew :android-core:assembleDebugAndroidTest --no-daemon

      - name: Инструментальные тесты
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          # Образ без Google Play: он легче и не требует принятия лицензий.
          target: default
          # Библиотека большая, старт с холодной загрузкой заметно дольше.
          disable-animations: true
          script: ./gradlew :android-core:connectedDebugAndroidTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android-core/build/reports/androidTests/
          retention-days: 14
